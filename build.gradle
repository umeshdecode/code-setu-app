plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '2.2.0'
}

group = 'com.cargosetu'
version = '1.0.0-SETU'
description = 'Code Setu app for packers and mover ERP management system'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    compileOnly 'org.projectlombok:lombok'
//    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    //Mapper
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    //  Jackson
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    // Align dataformat xml with databind to avoid NoSuchMethodError
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv:2.15.2'
// Remove the hibernate5 line and add this:
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'
    // CSV utility
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation 'com.opencsv:opencsv:5.9'

    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.microsoft.playwright:playwright:1.49.0'

    //Liquibase
    implementation 'org.liquibase:liquibase-core:4.23.2'
    implementation 'org.springframework.kafka:spring-kafka'
// Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-websocket
    implementation("org.springframework.boot:spring-boot-starter-websocket:3.5.11")

    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

// Flying Saucer HTML to PDF converter
    implementation 'org.xhtmlrenderer:flying-saucer-pdf:9.4.0'

    implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    // Spring Retry & AOP for reliable notifications
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Real-time Email & SMS integration
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.twilio.sdk:twilio:10.1.0'

    // Google ID token verification (Sign in with Google)
    implementation 'com.google.api-client:google-api-client:2.7.0'

    // AWS SDK v2 - S3 Storage
    implementation 'software.amazon.awssdk:s3:2.26.25'
    implementation 'software.amazon.awssdk:s3-transfer-manager:2.26.25'

    // Image compression before S3 upload (JPG / PNG)
    implementation 'net.coobird:thumbnailator:0.4.20'
}

tasks.named('test') {
    useJUnitPlatform()
}
