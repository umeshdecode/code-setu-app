spring.application.name=CargoSetuApp
application.version=1.1
application.title=CargoSetuApp


spring.profiles.active=prod
#spring.profiles.active=local
# ===============================
server.port=31201
# ===============================
#for dokcer configuarion
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/cargosetuapp?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.url=jdbc:mysql://localhost:3306/cargosetuapp?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
# ===============================
# Timezone Fix (IMPORTANT)
# ===============================
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET time_zone='+05:30'


# slf4j log

logging.level.org.springframework.web=INFO
logging.level.com.cargosetu=INFO

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Google Sign-In: verifies ID tokens issued to this client id (frontend-only flow, no client secret needed).
# Set the real value via the GOOGLE_CLIENT_ID env var - do not commit it.
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
spring.liquibase.change-log=classpath:Changelog/main.xml

# ===============================
# HikariCP Connection Pool
# ===============================

spring.datasource.hikari.pool-name=CargoSetuHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.keepalive-time=300000

# ===============================
# Notification Engine Thread Pool
# ===============================
app.notification.thread-pool.core-pool-size=10
app.notification.thread-pool.max-pool-size=20
app.notification.thread-pool.queue-capacity=2000
app.notification.thread-pool.thread-name-prefix=NotifWorker-

