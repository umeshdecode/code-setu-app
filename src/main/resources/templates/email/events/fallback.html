<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr><td align="center" style="padding-bottom:15px;">
        <div style="display:inline-block; background-color:#eff6ff; color:#2563eb; width:36px; height:36px; border-radius:50%; text-align:center; line-height:36px; font-size:18px; font-weight:bold;">&#128276;</div>
    </td></tr>
    <tr><td align="center"><h1 style="margin:0; font-size:22px; font-weight:700; color:#0f172a;">You have a new notification</h1></td></tr>
    <tr><td align="center" style="padding:15px 0 25px 0;">
        <p style="margin:0; font-size:15px; line-height:1.6; color:#475569;">
            Event: <strong style="color:#1e293b;" th:text="${eventType}">EVENT</strong>
        </p>
    </td></tr>
    <tr th:if="${variables != null and !variables.isEmpty()}"><td>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:20px;">
            <tr th:each="entry : ${variables}">
                <td style="padding:8px 0; border-bottom:1px solid #e2e8f0;">
                    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
                        <td style="font-size:13px; font-weight:500; color:#64748b;" th:text="${entry.key}">key</td>
                        <td align="right" style="font-size:14px; font-weight:600; color:#0f172a;" th:text="${entry.value}">value</td>
                    </tr></table>
                </td>
            </tr>
        </table>
    </td></tr>
</table>
