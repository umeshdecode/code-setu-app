Subject: Welcome to the Team, {{name}}!
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr><td align="center" style="padding-bottom:15px;">
        <div style="display:inline-block; background-color:#dcfce7; color:#16a34a; width:36px; height:36px; border-radius:50%; text-align:center; line-height:36px; font-size:18px; font-weight:bold;">&#10003;</div>
    </td></tr>
    <tr><td align="center"><h1 style="margin:0; font-size:22px; font-weight:700; color:#0f172a;">Account created successfully</h1></td></tr>
    <tr><td align="center" style="padding:15px 0 25px 0;">
        <p style="margin:0; font-size:15px; line-height:1.6; color:#475569;">Hi <strong style="color:#1e293b;">{{name}}</strong>, your staff account has been created. Use the credentials below to sign in.</p>
    </td></tr>
    <tr><td>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:20px;">
            <tr><td style="padding:12px 0; border-bottom:1px solid #e2e8f0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
                    <td style="font-size:13px; font-weight:500; color:#64748b;">Full Name</td>
                    <td align="right" style="font-size:14px; font-weight:600; color:#0f172a;">{{name}}</td>
                </tr></table>
            </td></tr>
            <tr><td style="padding:12px 0; border-bottom:1px solid #e2e8f0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
                    <td style="font-size:13px; font-weight:500; color:#64748b;">Email</td>
                    <td align="right" style="font-size:14px; font-weight:600; color:#2563eb; font-family:monospace;">{{email}}</td>
                </tr></table>
            </td></tr>
            <tr><td style="padding:12px 0 0 0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
                    <td style="font-size:13px; font-weight:500; color:#64748b;">Password</td>
                    <td align="right" style="font-size:14px; font-weight:600; color:#2563eb; font-family:monospace;">{{password}}</td>
                </tr></table>
            </td></tr>
        </table>
    </td></tr>
    <tr th:if="${loginUrl}"><td align="center" style="padding-top:25px;">
        <a th:href="${loginUrl}" style="background-color:#2563eb; border-radius:8px; color:#ffffff; display:inline-block; font-size:15px; font-weight:600; line-height:50px; text-align:center; text-decoration:none; width:100%;">Sign in to your account</a>
    </td></tr>
</table>
